<svg viewBox="0 0 900 120" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff0fa"/>
      <stop offset="50%" stop-color="#ffe0f2"/>
      <stop offset="100%" stop-color="#fff0fa"/>
    </linearGradient>
    <radialGradient id="petal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9de2"/>
      <stop offset="100%" stop-color="#ff5cc8"/>
    </radialGradient>
    <radialGradient id="petalDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e04fb0"/>
      <stop offset="100%" stop-color="#a8267f"/>
    </radialGradient>
    <g id="flower">
      <ellipse cx="0" cy="-14" rx="9" ry="14" fill="url(#petal)"/>
      <ellipse cx="0" cy="14" rx="9" ry="14" fill="url(#petal)"/>
      <ellipse cx="-14" cy="0" rx="14" ry="9" fill="url(#petal)"/>
      <ellipse cx="14" cy="0" rx="14" ry="9" fill="url(#petal)"/>
      <ellipse cx="-10" cy="-10" rx="9" ry="13" fill="url(#petalDark)" transform="rotate(45 -10 -10)"/>
      <ellipse cx="10" cy="-10" rx="9" ry="13" fill="url(#petalDark)" transform="rotate(-45 10 -10)"/>
      <ellipse cx="-10" cy="10" rx="9" ry="13" fill="url(#petalDark)" transform="rotate(-45 -10 10)"/>
      <ellipse cx="10" cy="10" rx="9" ry="13" fill="url(#petalDark)" transform="rotate(45 10 10)"/>
      <circle cx="0" cy="0" r="7" fill="#fff6fb"/>
      <circle cx="0" cy="0" r="4" fill="#ffd700"/>
    </g>
  </defs>

  <rect width="900" height="120" fill="url(#bg)"/>

  <use href="#flower" x="40" y="30" transform="scale(1)"/>
  <use href="#flower" x="130" y="80" transform="scale(0.7)"/>
  <use href="#flower" x="230" y="35" transform="scale(0.9)"/>
  <use href="#flower" x="330" y="75" transform="scale(0.6)"/>
  <use href="#flower" x="430" y="30" transform="scale(1)"/>
  <use href="#flower" x="520" y="80" transform="scale(0.7)"/>
  <use href="#flower" x="620" y="35" transform="scale(0.9)"/>
  <use href="#flower" x="720" y="75" transform="scale(0.6)"/>
  <use href="#flower" x="820" y="30" transform="scale(1)"/>

  <!-- little leaves -->
  <path d="M 60 60 Q 75 50 90 60 Q 75 70 60 60 Z" fill="#7fd992" opacity="0.8"/>
  <path d="M 260 60 Q 275 50 290 60 Q 275 70 260 60 Z" fill="#7fd992" opacity="0.8"/>
  <path d="M 460 60 Q 475 50 490 60 Q 475 70 460 60 Z" fill="#7fd992" opacity="0.8"/>
  <path d="M 660 60 Q 675 50 690 60 Q 675 70 660 60 Z" fill="#7fd992" opacity="0.8"/>
  <path d="M 850 60 Q 865 50 880 60 Q 865 70 850 60 Z" fill="#7fd992" opacity="0.8"/>
</svg>
