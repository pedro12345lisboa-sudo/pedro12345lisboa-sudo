name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate pink snake game from GitHub contribution grid
        uses: Platane/snk@v3
        with:
          github_user_name: pedro12345lisboa-sudo
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23ff1b7c,%23ff5c9d,%23ff8fb8&color_dots=%232a0a14,%234d1526,%237a1f3d,%23a8264f,%23d92e63&color_empty=%23100a0c

      - name: Push output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}